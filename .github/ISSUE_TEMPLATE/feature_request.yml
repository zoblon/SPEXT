name: Feature request
description: Suggest a new capability or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        SPEXT deliberately stays small: hold a hotkey, speak, get text. Explaining the situation you want to solve helps more than a finished solution.
  - type: textarea
    id: usecase
    attributes:
      label: What do you want to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
