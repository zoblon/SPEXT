name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your OpenAI API key or private dictation content into an issue.**
  - type: input
    id: version
    attributes:
      label: SPEXT version
      description: Shown in the menu bar popover or in the app's Info.
      placeholder: "1.0.23"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 27.0, MacBook Pro M3"
    validations:
      required: true
  - type: input
    id: microphone
    attributes:
      label: Microphone
      description: Built-in, USB, AirPods (which model), iPhone (Continuity), …
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
